# Each topic is a heading. To add a topic, copy a whole block and change the name.
# Each feed needs a name and a url. region and country are optional labels.
# Put quotes around addresses so a later url that contains & still works.

topics:
  - name: "News"
    feeds:
      - name: "BBC News"
        url: "https://feeds.bbci.co.uk/news/rss.xml"
        region: "Europe"
        country: "United Kingdom"

  - name: "Technology"
    feeds:
      - name: "The Guardian Technology"
        url: "https://www.theguardian.com/technology/rss"
        country: "United Kingdom"
      - name: "Ars Technica"
        url: "https://feeds.arstechnica.com/arstechnica/index"
        country: "United States"
      - name: "The Verge"
        url: "https://www.theverge.com/rss/index.xml"
        country: "United States"
      - name: "NASA"
        url: "https://www.nasa.gov/rss/dyn/breaking_news.rss"
        country: "United States"
      - name: "PetaPixel"
        url: "https://petapixel.com/feed/"
        country: "United States"
